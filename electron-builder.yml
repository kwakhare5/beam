appId: com.beam.app
productName: Beam
directories:
  output: release
files:
  - dist/**/*
  - '!dist/main/dev/**'
  - package.json
extraResources:
  - from: native/BeamBridge/dist/BeamBridge.exe
    to: BeamBridge.exe
  - from: assets/tray.ico
    to: tray.ico
win:
  target: nsis
  icon: build/icon.png
artifactName: Beam-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Beam
  runAfterFinish: true
  deleteAppDataOnUninstall: false
